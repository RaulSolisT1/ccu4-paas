events {}
http {
    upstream api_pool {
        include /etc/nginx/upstream.conf;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout;
        }
    }
}
